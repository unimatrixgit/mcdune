/* Citizens Registry: first API-conform staff page.
   V1 verified: GET /api/auth/session; GET /api/admin/register-user
   (rank options); POST /api/admin/register-user with username,email,
   ageBand,ranks. No unverified list-users endpoint is assumed.

function citizenRegistryPage(overview,actions){
 const section=el('section','citizen-module');section.setAttribute('aria-label','Citizen Registry');

 const username=field('Minecraft / website username','text','username');username.pattern='[A-Za-z0-9_]{3,32}';username.maxLength=32;

 const ageLabel=el('label','citizen-field');ageLabel.append(el('span','','Declared age group'));const age=el('select','module-search');age.name='ageBand';age.required=true;for(const [value,title] of [['','Choose age group'],['15plus','15 or older'],['under15','Under 15']]){const o=el('option','',title);o.value=value;age.append(o)}ageLabel.append(age);form.append(ageLabel);
