<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DuneRealms CP V2 — Dry Run</title><style>*{box-sizing:border-box}html{font-family:system-ui,Segoe UI,sans-serif;color:#e7e8dc;background:#0b1419}body{margin:0}button{font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #e8c97a;outline-offset:3px}.shell{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:100vh}.sidebar{background:#101d24;border-right:1px solid #314750;padding:22px 14px;overflow:auto}.brand{display:flex;align-items:center;gap:12px;padding:8px 12px 22px;border-bottom:1px solid #344b52}.brand-mark{width:40px;height:40px;display:grid;place-items:center;background:#c4a264;color:#15252b;font-size:23px;font-weight:900;border-radius:9px}.brand strong{display:block;letter-spacing:.09em}.brand small{font-size:11px;color:#93aab2}.nav-group{margin-top:20px}.nav-label{text-transform:uppercase;font-size:10px;font-weight:800;letter-spacing:.18em;color:#d1b679;padding:0 12px 9px}.nav-item{display:flex;width:100%;align-items:center;justify-content:space-between;border:1px solid transparent;border-radius:7px;background:none;color:#b9cbd0;text-align:left;padding:10px 12px;margin:2px 0;font-size:13px}.nav-item:hover,.nav-item[aria-pressed=true]{background:#24383e;color:#f7df9b;border-color:#516458}.nav-item span{opacity:.5}.main{min-width:0}.topbar{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid #2b4046;padding:14px 28px;background:#122229}.topbar strong{letter-spacing:.08em;font-size:12px}.topbar small{color:#a5b6b8}.content{padding:30px;max-width:1400px;margin:auto}.page-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:28px}.page-heading h1{font-size:clamp(25px,3vw,37px);margin:5px 0 8px}.page-heading p{color:#a5b6b8;margin:0}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.16em;color:#d6b875!important}.status{padding:7px 12px;border:1px solid #8d774a;border-radius:20px;color:#e7d39d;font-size:11px;white-space:nowrap}.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:18px}.kpis article,.mock-panel{border:1px solid #304951;border-radius:12px;background:linear-gradient(140deg,#1b3036,#122329);padding:20px}.kpis small{display:block;color:#9babb1;margin-bottom:10px}.kpis strong{font-size:16px}.panel-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:18px}.mock-panel h2{font-size:17px;margin:0 0 12px}.mock-panel p{color:#9daeb4;font-size:13px}.skeleton{height:18px;background:#2b4147;border-radius:4px;width:75%;margin-top:17px}.skeleton.long{width:100%}.skeleton.short{width:42%}.mock-row{display:flex;justify-content:space-between;gap:8px;border-bottom:1px solid #355057;padding:13px 0;color:#d7e0df;font-size:13px}.mock-row span{color:#d7b976}.preview-page[hidden]{display:none!important}.disclaimer{font-size:11px;color:#c8b177;padding:12px 28px;border-bottom:1px solid #3c4b44;background:#252c26}@media(max-width:900px){.shell{grid-template-columns:210px minmax(0,1fr)}.content{padding:20px}.panel-grid{grid-template-columns:1fr}}@media(max-width:650px){.shell{display:block}.sidebar{max-height:240px;overflow:auto;border-bottom:1px solid #344b52}.topbar{padding:12px 16px}.content{padding:18px}.kpis{grid-template-columns:1fr}.page-heading{flex-direction:column}.nav-group{display:inline-block;vertical-align:top;min-width:180px}}
.workspace-tabs{display:flex;flex-wrap:wrap;gap:7px}.workspace-tab{padding:9px 12px;border-radius:8px;border:1px solid #516057;background:#20343a;color:#d7e2db}.workspace-tab[aria-pressed=true]{background:#48503b;border-color:#d8b873;color:#ffe5a4}.mail-alert{width:100%;margin:18px 0 10px;padding:13px;border:1px solid #b99a57;background:#2c3c37;color:#f2d9a4;border-radius:9px;text-align:left}.mail-alert small{display:block;color:#b5c0b9}.nav-context{padding:14px 12px 6px;color:#d8ba77;font-weight:700;text-transform:uppercase;letter-spacing:.12em;font-size:11px}.topbar{flex-wrap:wrap}@media(max-width:800px){.workspace-tabs{order:3;width:100%}}</style></head><body><div class="disclaimer">DESIGN DRY RUN — no live data, authentication, or write actions. V1 remains unchanged.</div><div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">D</span><div><strong>DUNEREALMS</strong><small>Developer Console V2</small></div></div><button class="mail-alert" id="mail-alert" type="button">✉ You’ve got mail <small>Inbox preview</small></button><div class="nav-context" id="nav-context">My Realm</div><nav id="preview-navigation" aria-label="Control panel V2 preview"></nav></aside><div class="main"><header class="topbar"><strong>CONTROL PANEL / V2</strong><nav class="workspace-tabs" id="workspace-tabs" aria-label="Workspaces"></nav><small>Design review</small></header><main class="content" id="preview-content"></main></div></div><script>// Design-only preview: no live data, permission grants, or API writes.
const labels=new Map([["game", "My Identity"], ["site-profile", "Personal Records"], ["personal-bank", "My Treasury"], ["shared-inbox", "My Correspondence"], ["tickets", "Petition Hall"], ["planetary-inventory", "My Inventory"], ["quests", "Contracts & Quests"], ["kits-exchange", "Imperial Tailor"], ["exchange-settings", "Exchange settings"], ["shop-settings", "Shop settings"], ["rewards-codes", "Rewards &amp; codes"], ["crysknife", "Order of the Crysknife"], ["transactions", "Transaction Ledger"], ["git-control", "Github"], ["webmail", "DuneRealms Mail"], ["hosting-control", "Hosting control"], ["bank-dashboard", "Bank Dashboard"], ["loan-centre", "Loan Centre"], ["loan-administration", "Loan Administration"], ["landsraad", "Landsraad Assembly"], ["council-motd", "Proclamations"], ["house-elections", "Faction Elections"], ["imperial-elections", "Emperor Elections"], ["applications", "Election Applications"], ["electoral-roll", "Electoral Roll"], ["formal-council", "Faction Council"], ["imperial-command", "Imperial Council"], ["website-posts", "News center"], ["shop-admin", "Shop management"], ["staff-tickets", "Support tickets"], ["bans", "Bans &amp; Appeals"], ["forum-admin", "Forum Moderation"], ["user-management", "Citizens Registry"], ["manual-seals", "Award management"], ["company-management", "Company management"], ["permissions", "Website ranks"], ["luckperms", "Minecraft LP"], ["server-operations", "Network Command"], ["support-management", "osTicket management"], ["dev-approvals", "Review Chamber"], ["quests-admin", "Quest management"], ["server-kits", "Kit Directorate"], ["exchange-admin", "Exchange management"], ["git-admin", "Git management"], ["community-goals", "Community goals"], ["staff-bank", "I.D. Revenue"], ["items", "Item management"], ["dev-panel", "Forge Overview"], ["dev-queue", "Work Orders"], ["dev-approvals", "Review Chamber"], ["dev-new", "Submit Blueprint"], ["dev-archive", "Forge Archives"], ["companies", "My Companies"], ["company-directory", "Company Registry"], ["company-registration", "Establish a Company"], ["company-profile", "Corporate Records"], ["company-members", "Company Officers"], ["company-finance", "Corporate Treasury"], ["company-permissions", "Corporate Authority"], ["company-applications", "Pending Petitions"], ["company-management-v2", "Company Directorate"], ["company-audit", "Corporate Audit"], ["kit-market-v2", "Market Purchases"], ["kit-publishing", "Kit Publications"], ["kit-claims", "Claim Registry"], ["sales-history", "Sales History"], ["mail-inbox", "Incoming Dispatches"], ["mail-compose", "Compose Dispatch"], ["mail-sent", "Sent Dispatches"], ["mail-archive", "Imperial Archives"], ["mail-settings", "Correspondence Settings"], ["bank-overview", "Treasury Overview"], ["bank-transfers", "Transfer Solari"], ["bank-statements", "Account Ledger"], ["bank-loans", "Credit Office"], ["stock-overview", "Market Overview"], ["stock-listings", "Listed Enterprises"], ["stock-portfolio", "My Holdings"], ["stock-orders", "Trading Floor"], ["stock-trades", "Trade Ledger"], ["stock-admin", "Market Authority"]]),groups={"user": ["game", "site-profile", "personal-bank", "shared-inbox", "tickets", "planetary-inventory", "quests", "kits-exchange", "transactions", "companies", "company-directory", "company-registration", "company-profile", "company-members", "company-finance", "company-permissions", "company-applications", "sales-history"], "admin": ["user-management", "company-management", "company-management-v2", "company-audit", "website-posts", "shop-admin", "staff-tickets", "bans", "forum-admin", "manual-seals", "permissions", "luckperms", "server-operations", "support-management", "quests-admin", "server-kits", "kit-publishing", "kit-claims", "exchange-admin", "git-admin", "community-goals", "staff-bank", "items", "stock-admin"], "dev": ["dev-panel", "dev-queue", "dev-approvals", "dev-new", "dev-archive", "git-control"], "mail": ["mail-inbox", "mail-compose", "mail-sent", "mail-archive", "mail-settings", "shared-inbox", "webmail"], "bank": ["bank-overview", "personal-bank", "bank-dashboard", "bank-transfers", "bank-statements", "bank-loans", "loan-centre", "loan-administration", "staff-bank", "company-finance"], "stock": ["stock-overview", "stock-listings", "stock-portfolio", "stock-orders", "stock-trades", "stock-admin", "companies", "company-directory", "company-profile"]},tabs=[["user", "My Realm", "\u25c9"], ["admin", "Imperial Bureau", "\u2699"], ["dev", "DuneForge", "\u2318"], ["mail", "Imperial Post", "\u2709"], ["bank", "Postbank", "\u25a3"], ["stock", "CHOAM Exchange", "\u25a5"]];
const nav=document.querySelector('#preview-navigation'),main=document.querySelector('#preview-content'),top=document.querySelector('#workspace-tabs');
for(const [id,name,logo] of tabs){const b=document.createElement('button');b.className='workspace-tab';b.dataset.tab=id;b.textContent=logo+' '+name;b.onclick=()=>openPage(groups[id][0],id);top.append(b)}
document.querySelector('#mail-alert').onclick=()=>openPage('shared-inbox','user');
function openPage(page,tab){tab=tab||Object.keys(groups).find(g=>groups[g].includes(page))||'user';if(!groups[tab].includes(page))page=groups[tab][0];nav.replaceChildren();document.querySelector('#nav-context').textContent=tabs.find(t=>t[0]===tab)[1];for(const id of groups[tab]){const b=document.createElement('button');b.className='nav-item';b.textContent=labels.get(id)||id;b.setAttribute('aria-pressed',String(id===page));b.onclick=()=>openPage(id,tab);nav.append(b)}for(const b of top.children)b.setAttribute('aria-pressed',String(b.dataset.tab===tab));main.replaceChildren();const section=document.createElement('section');section.className='preview-page';const h=document.createElement('h1');h.textContent=labels.get(page)||page;section.append(h);const p=document.createElement('p');p.textContent='Design placeholder only — no live functionality.';section.append(p);const card=document.createElement('article');card.className='mock-panel';card.innerHTML='<h2>Workspace preview</h2><p>Awaiting design approval and component migration.</p><div class="skeleton long"></div><div class="skeleton"></div>';section.append(card);main.append(section);history.replaceState(null,'','#'+tab+'/'+page)}
function route(){const [tab,page]=location.hash.slice(1).split('/');if(groups[tab])openPage(page||groups[tab][0],tab);else openPage(tab||'game')}
window.addEventListener('hashchange',route);route();
</script></body></html>
