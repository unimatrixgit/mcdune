const tabs=[...document.querySelectorAll('.tab')],side=document.querySelector('#sideitems'),main=document.querySelector('#workspace'),alert=document.querySelector('#mailalert');
function render(id,page){const w=menu.workspaces.find(x=>x.id===id)||menu.workspaces[0];const all=w.groups.flatMap(g=>g.items);const selected=all.find(x=>x.id===page)||all[0];tabs.forEach(t=>t.setAttribute('aria-selected',String(t.dataset.workspace===w.id)));side.replaceChildren();const art=ART[w.id];document.querySelector('#category-symbol').textContent=art[1];document.querySelector('#category-name').textContent=w.label;document.querySelector('#category-banner').style.setProperty('--art', 'url("https://www.dunerealms.com/assets/'+art[0]+'")');document.querySelector('#sidehead').textContent=w.label+' / NAVIGATION';alert.hidden=w.id!=='realm';const right=document.querySelector('#rightitems');right.replaceChildren();const groups=w.groups;const total=groups.reduce((n,g)=>n+g.items.length+2,0);let running=0,split=0,best=Infinity;for(let i=1;i<groups.length;i++){running+=groups[i-1].items.length+2;const delta=Math.abs(total-2*running);if(delta<best){best=delta;split=i}}if(groups.length<2)split=groups.length;function addGroup(g,target){const block=document.createElement('section');block.className='group-block';const label=document.createElement('div');label.className='group';label.textContent=g.label;block.append(label);for(const item of g.items){const b=document.createElement('button');b.className='navitem';b.type='button';b.textContent=item.label;const symbol=document.createElement('span');symbol.className='navsymbol';symbol.textContent='◇';b.prepend(symbol);b.setAttribute('aria-current',item.id===selected.id?'page':'false');const marker=document.createElement('span');marker.textContent='›';b.append(marker);b.onclick=()=>render(w.id,item.id);block.append(b)}target.append(block)}groups.forEach((g,i)=>addGroup(g,i<split?side:right));main.replaceChildren();const section=document.createElement('section');section.innerHTML='<div class="heading"><div><div class="eyebrow"></div><h1></h1><p class="desc">Dedicated V2 page design. Placeholder only; existing APIs and V1 permissions are untouched.</p></div><div class="tag">DESIGN ONLY</div></div><div class="metrics"><div class="metric"><small>DATA SOURCE</small><strong>MOCK</strong></div><div class="metric"><small>PERMISSION</small><strong>UNASSIGNED</strong></div><div class="metric"><small>IMPLEMENTATION</small><strong>PENDING</strong></div></div><div class="grid"><article class="card"><h2>MAIN WORKSPACE</h2><p class="hint">Component placement and interaction patterns will be reviewed before integration.</p><div class="placeholder"><div class="line"></div><div class="line"></div><div class="line"></div></div></article><article class="card"><h2>CONTEXT & ACTIONS</h2><p class="hint">Actions are intentionally disabled in this preview.</p><p class="legend">VIEW NODE</p><code class="notice" id="viewnode"></code><p class="legend">MANAGE NODE</p><code class="notice" id="managenode"></code></article></div>';section.querySelector('h1').textContent=selected.label;section.querySelector('.eyebrow').textContent=w.label+' / '+selected.id;section.querySelector('#viewnode').textContent=selected.viewPermission;section.querySelector('#managenode').textContent=selected.managePermission;main.append(section);history.replaceState(null,'','#'+w.id+'/'+selected.id)}
