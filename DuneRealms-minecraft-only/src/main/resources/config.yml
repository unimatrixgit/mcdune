spice-respawn-seconds: 120

# Sandworms spawn near players on Arrakis only, at most once per interval serverwide.
# A visible Sniffer body follows an invisible Husk with native zombie targeting and melee AI.
sandworms:
  enabled: true
  health: 500.0
  attack-damage: 8.0
  movement-speed: 0.33
  scale: 3.5
  max-per-world: 3
  spawn-chance: 0.35
  spawn-interval-seconds: 3600

# Hostile Fremen raiders appear around Arrakis players and are more common near
# spice fields worth over this many Solaris at the base selling price.
spice-raiders:
  enabled: true
  max-per-world: 12
  chance-per-player-check: 0.08
  chance-near-rich-field: 0.45
  field-radius: 32
  field-value-threshold: 5000
  health: 36.0
  attack-damage: 6.0
  movement-speed: 0.28

# Arrakis solar exposure: 5 minutes of uninterrupted direct sunlight without a full stillsuit.
arrakis-sun:
  enabled: true
  lethal-seconds: 300
  warning-interval-seconds: 30

# One Paper backend per planet, connected through Velocity's BungeeCord plugin messaging support.
network:
  enabled: true
  local-planet: arrakis  # Match server.planet in DuneTerrain on this backend
  servers:
    arrakis: arrakis
    giedi_prime: giedi-prime
    kaitain: kaitain
    caladan: caladan
    sigma_draconis_iv: sigma-draconis-iv

# Prototype politics (state is LOCAL to each Paper server).
# Do not enable multi-server elections/treasury until shared transactional storage is added.
politics:
  trust-levy: 0.0121
  invasion-cost: 50000
  invasion-minutes: 60
  defenders-needed: 5
  arrakis-edict-minutes: 60

arrakis-water:
  smuggler-retaliation-chance: 0.30
  sietch-chunk-chance: 90

database:
  enabled: false
  jdbc-url: "jdbc:postgresql://127.0.0.1:5432/dunerealms"
  username: "dune"
  password: "CHANGE_ME"

# NPC settings are now managed by DuneNPC/config.yml.
website:
  discord:
    enabled: false
    exchange-channel-id: ""
    news-channel-id: ""
    diplomacy-channel-id: ""
