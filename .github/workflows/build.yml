
name: Build DuneRealms

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

- name: Find and compile DuneRealms
  shell: bash
  run: |
    echo "Looking for Gradle project..."
    find . -name build.gradle.kts

    BUILD_FILE=$(find . -name build.gradle.kts -print -quit)

    if [ -z "$BUILD_FILE" ]; then
      echo "ERROR: build.gradle.kts was not found!"
      exit 1
    fi

    PROJECT_DIR=$(dirname "$BUILD_FILE")
    echo "Building project in: $PROJECT_DIR"

    gradle -p "$PROJECT_DIR" clean build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: DuneRealms-Plugin
          path: build/libs/*.jar
          if-no-files-found: error
