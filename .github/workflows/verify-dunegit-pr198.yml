name: DuneGit PR 198 Full Website Verification
on:
  push:
    branches:
      - ci/pr198-website-verification-20261112
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch frozen DuneGit PR 198 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch fix/website-integrations-20261111 https://www.dunerealms.com/git/unimatrix/MC.git source
          actual="$(git -C source rev-parse HEAD)"
          expected="86496ebbb1c6b8124777bb1a547c952eacf8f361"
          echo "DuneGit head: $actual"
          test "$actual" = "$expected" || { echo "::error::PR 198 head changed; refusing to test a different snapshot"; exit 1; }
      - name: Install dependencies
        working-directory: source/website
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Build website
        working-directory: source/website
        run: corepack pnpm build
      - name: Full website test suite
        working-directory: source/website
        run: corepack pnpm test
